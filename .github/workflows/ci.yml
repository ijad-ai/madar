name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  compose:
    name: docker compose up (Redis, Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T redis redis-cli config get maxmemory-policy | grep -q noeviction
      - run: docker compose exec -T postgres psql -U madar -d madar -c 'select 1'
      - if: always()
        run: docker compose down -v
