name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Integration tests run against the same Redis and Postgres versions as docker-compose.
    services:
      redis:
        image: redis:8.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_ci
          POSTGRES_DB: madar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U madar -d madar" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://madar:madar_ci@127.0.0.1:5432/madar
      # Fail instead of skipping if the services above are missing.
      REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

  compose:
    name: docker compose up (Redis, Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T redis redis-cli config get maxmemory-policy | grep -q noeviction
      - run: docker compose exec -T postgres psql -U madar -d madar -c 'select 1'
      - if: always()
        run: docker compose down -v
